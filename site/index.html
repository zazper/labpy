<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabPy: Python in your browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader"><div class="card">
  <h2>Loading Python</h2>
  <p id="lstatus">Starting…</p>
  <div class="bar"><div id="lbar"></div></div>
  <p class="muted" id="lsub">First visit only: about 12 MB. It is cached after this.</p>
</div></div>
<header>
  <b class="logo">LabPy</b>
  <button id="run" class="primary" disabled>Run</button>
  <button id="stop" disabled>Stop</button>
  <button id="clear">Clear output</button>
  <select id="examples"><option value="">Load an example…</option></select>
  <span class="sp"></span>
  <button id="share">Copy share link</button>
  <button id="upload">Upload files</button>
  <button id="download">Download file</button>
  <span id="state" class="muted">Loading…</span>
</header>
<nav id="tabs"></nav>
<main>
  <section id="editor"></section>
  <section id="out"><pre id="console"></pre><div id="plots"></div></section>
</main>
<input type="file" id="file" multiple hidden>
<script src="app.js"></script>
</body>
</html>
